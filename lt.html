<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习打卡日历</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --primary: #4f6ef2;
    --primary-soft: #e8edfd;
    --success: #22b573;
    --success-soft: #e3f7ee;
    --text: #2b2f3a;
    --text-2: #8a90a0;
    --border: #e7eaf2;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .app {
    max-width: 1060px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 22px;
  }
  header h1 { font-size: 22px; font-weight: 700; }
  header .sub { color: var(--text-2); font-size: 13px; margin-top: 4px; }
  .stats { display: flex; gap: 10px; }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--text-2);
    text-align: center;
  }
  .stat b { display: block; font-size: 18px; color: var(--text); }
  .stat b.green { color: var(--success); }
  .layout {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 18px;
    align-items: start;
  }
  @media (max-width: 820px) {
    .layout { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
  }
  /* ---- Calendar ---- */
  .cal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .cal-head h2 { font-size: 17px; font-weight: 600; }
  .cal-head .actions { display: flex; gap: 8px; align-items: center; }
  .cal-head button {
    border: 1px solid var(--border);
    background: #fff;
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    color: var(--text);
    transition: .15s;
  }
  .cal-head button:hover { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
  .today-btn {
    border: none; background: var(--primary-soft); color: var(--primary);
    font-size: 12px; padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .grid-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .grid-week span { text-align: center; font-size: 12px; color: var(--text-2); padding: 4px 0; }
  .grid-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 10px;
    border: 1px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    font-size: 14px;
    transition: .15s;
    position: relative;
  }
  .day:hover { background: var(--primary-soft); }
  .day.dim { color: #c3c8d4; }
  .day.selected { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }
  .day.today .num { color: var(--primary); font-weight: 700; }
  .day .num { line-height: 1; }
  .day .ring {
    width: 26px; height: 5px;
    border-radius: 3px;
    background: #edf0f6;
    overflow: hidden;
    display: flex;
  }
  .day .ring i { display: block; height: 100%; background: var(--success); }
  .day.all-done { background: var(--success-soft); }
  .day.all-done:hover { background: var(--success-soft); }
  .day .count {
    font-size: 9px; color: var(--text-2);
    position: absolute; top: 4px; right: 6px;
  }
  /* ---- Task panel ---- */
  .panel-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .panel-sub { color: var(--text-2); font-size: 12px; margin-bottom: 14px; }
  .add-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .add-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    outline: none;
    transition: .15s;
  }
  .add-row input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .add-row button {
    background: var(--primary);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
    transition: .15s;
  }
  .add-row button:hover { filter: brightness(1.08); }
  .task-list { display: flex; flex-direction: column; gap: 8px; }
  .task {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: .15s;
  }
  .task:hover { border-color: #d5dae6; }
  .task .check {
    width: 20px; height: 20px;
    border: 2px solid #c6ccdb;
    border-radius: 6px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: transparent;
    font-size: 13px;
    transition: .15s;
    user-select: none;
  }
  .task.done .check { background: var(--success); border-color: var(--success); color: #fff; }
  .task .txt { flex: 1; font-size: 14px; cursor: default; }
  .task.done .txt { text-decoration: line-through; color: var(--text-2); }
  .task .del {
    border: none; background: none; color: #c3c8d4;
    font-size: 15px; cursor: pointer; padding: 2px 4px; border-radius: 6px;
  }
  .task .del:hover { color: #e05656; background: #fdeeee; }
  .empty { text-align: center; color: var(--text-2); font-size: 13px; padding: 26px 0; }
  .progress-wrap { margin-top: 16px; }
  .progress-label { font-size: 12px; color: var(--text-2); margin-bottom: 6px; display: flex; justify-content: space-between; }
  .progress-bar { height: 8px; background: #edf0f6; border-radius: 4px; overflow: hidden; }
  .progress-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--success)); border-radius: 4px; transition: width .3s; }
  footer { text-align: center; color: #b9becc; font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>📚 学习打卡日历</h1>
      <div class="sub">每天记录学习任务，点亮你的进度条</div>
    </div>
    <div class="stats">
      <div class="stat"><b id="statToday">0/0</b>今日任务</div>
      <div class="stat"><b id="statDone">0/0</b>今日完成</div>
      <div class="stat"><b class="green" id="statStreak">0</b>连续打卡</div>
    </div>
  </header>

  <div class="layout">
    <div class="card">
      <div class="cal-head">
        <h2 id="calTitle">2026年9月</h2>
        <div class="actions">
          <button id="btnToday" class="today-btn">回到今天</button>
          <button id="btnPrev">‹</button>
          <button id="btnNext">›</button>
        </div>
      </div>
      <div class="grid-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="grid-days" id="calDays"></div>
    </div>

    <div class="card">
      <div class="panel-title" id="panelTitle">9月3日 星期四</div>
      <div class="panel-sub" id="panelSub">点击日历任意日期查看当天任务</div>
      <div class="add-row">
        <input id="taskInput" type="text" placeholder="输入学习任务，回车添加…" maxlength="60">
        <button id="btnAdd">添加</button>
      </div>
      <div class="task-list" id="taskList"></div>
      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-label"><span>完成进度</span><span id="progressText">0/0</span></div>
        <div class="progress-bar"><i id="progressFill" style="width:0%"></i></div>
      </div>
    </div>
  </div>

  <footer>数据保存在本机浏览器 · 无需登录 · 换浏览器/清缓存数据会丢失</footer>
</div>

<script>
(function () {
  const STORE_KEY = 'learning-tracker-tasks-v1';
  // tasks: { "2026-09-03": [ {id, text, done}, ... ] }
  let tasks = {};
  try { tasks = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { tasks = {}; }

  const pad = n => String(n).padStart(2, '0');
  const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-based
  let selected = dkey(today);

  const $ = id => document.getElementById(id);
  const WEEK = ['日', '一', '二', '三', '四', '五', '六'];

  function save() { localStorage.setItem(STORE_KEY, JSON.stringify(tasks)); }

  function dayTasks(key) { return tasks[key] || []; }

  function renderCalendar() {
    $('calTitle').textContent = `${viewYear}年${viewMonth + 1}月`;
    const grid = $('calDays');
    grid.innerHTML = '';
    const first = new Date(viewYear, viewMonth, 1);
    const start = new Date(first);
    start.setDate(1 - first.getDay());
    const todayKey = dkey(today);

    for (let i = 0; i < 42; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      const key = dkey(d);
      const inMonth = d.getMonth() === viewMonth;
      const list = dayTasks(key);
      const done = list.filter(t => t.done).length;
      const allDone = list.length > 0 && done === list.length;

      const cell = document.createElement('div');
      cell.className = 'day' +
        (inMonth ? '' : ' dim') +
        (key === selected ? ' selected' : '') +
        (key === todayKey ? ' today' : '') +
        (allDone ? ' all-done' : '');
      cell.innerHTML = `<span class="num">${d.getDate()}</span>` +
        (list.length
          ? `<span class="ring">${done ? `<i style="width:${done / list.length * 100}%"></i>` : ''}</span>`
          : '');
      cell.title = list.length ? `${done}/${list.length} 已完成` : '';
      cell.addEventListener('click', () => { selected = key; render(); });
      grid.appendChild(cell);
    }
  }

  function renderPanel() {
    const d = new Date(selected + 'T00:00:00');
    $('panelTitle').textContent = `${d.getMonth() + 1}月${d.getDate()}日 星期${WEEK[d.getDay()]}`;
    const list = dayTasks(selected);
    const done = list.filter(t => t.done).length;
    $('panelSub').textContent = list.length
      ? (done === list.length ? '🎉 全部完成，干得漂亮！' : `共 ${list.length} 项，已完成 ${done} 项`)
      : '这一天还没有任务，添加一条吧';

    const ul = $('taskList');
    ul.innerHTML = '';
    if (!list.length) {
      ul.innerHTML = '<div class="empty">暂无任务 · 上面输入框添加</div>';
    }
    list.forEach(t => {
      const row = document.createElement('div');
      row.className = 'task' + (t.done ? ' done' : '');
      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';
      check.title = t.done ? '标记为未完成' : '确认完成';
      check.addEventListener('click', () => {
        t.done = !t.done;
        save(); render();
      });
      const txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = '✕';
      del.title = '删除任务';
      del.addEventListener('click', () => {
        tasks[selected] = list.filter(x => x.id !== t.id);
        if (!tasks[selected].length) delete tasks[selected];
        save(); render();
      });
      row.append(check, txt, del);
      ul.appendChild(row);
    });

    const wrap = $('progressWrap');
    if (list.length) {
      wrap.style.display = '';
      $('progressText').textContent = `${done}/${list.length}`;
      $('progressFill').style.width = (done / list.length * 100) + '%';
    } else {
      wrap.style.display = 'none';
    }
  }

  function renderStats() {
    const tk = dkey(today);
    const list = dayTasks(tk);
    const done = list.filter(t => t.done).length;
    $('statToday').textContent = `${list.length}`;
    $('statDone').textContent = `${done}/${list.length}`;

    // streak: 从今天往前数，每天都有任务且全部完成
    let streak = 0;
    const cur = new Date(today);
    while (true) {
      const k = dkey(cur);
      const l = tasks[k];
      if (l && l.length && l.every(t => t.done)) { streak++; cur.setDate(cur.getDate() - 1); }
      else break;
    }
    $('statStreak').textContent = streak;
  }

  function render() { renderCalendar(); renderPanel(); renderStats(); }

  function addTask() {
    const input = $('taskInput');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    if (!tasks[selected]) tasks[selected] = [];
    tasks[selected].push({ id: Date.now() + '' + Math.floor(Math.random() * 1000), text, done: false });
    save();
    input.value = '';
    input.focus();
    render();
  }

  $('btnAdd').addEventListener('click', addTask);
  $('taskInput').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
  $('btnPrev').addEventListener('click', () => {
    viewMonth--;
    if (viewMonth < 0) { viewMonth = 11; viewYear--; }
    render();
  });
  $('btnNext').addEventListener('click', () => {
    viewMonth++;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    render();
  });
  $('btnToday').addEventListener('click', () => {
    viewYear = today.getFullYear();
    viewMonth = today.getMonth();
    selected = dkey(today);
    render();
  });

  render();
})();
</script>
</body>
</html>
